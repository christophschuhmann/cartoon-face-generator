name: Rig and mapper tests
on: [push, pull_request]
jobs:
  shared-rig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: python -m pip install -e '.[test]'
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m pytest -q
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m pytest tests/test_detector.py -q
