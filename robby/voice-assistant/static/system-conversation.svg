<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">01 · From microphone to a spoken reply</title><desc id="desc">Work overlaps where possible. The endpoint waits for an actual speech pause.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#506678" stroke-width="1.5"/></marker></defs><rect width="1000" height="520" rx="24" fill="#f5f8fb"/><g font-family="system-ui, sans-serif" fill="#1d3346"><text x="28" y="40" font-size="23" font-weight="700">01 · From microphone to a spoken reply</text><text x="28" y="66" font-size="14" fill="#52687a">Work overlaps where possible. The endpoint waits for an actual speech pause.</text><path d="M215 170 L255 170" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M465 170 L505 170" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M720 170 L760 170" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M864 232 L620 302" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="742.0" y="258.0" text-anchor="middle" font-size="12">completed sentence</text><path d="M720 358 L760 358" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="740.0" y="349.0" text-anchor="middle" font-size="12">PCM</text><rect x="25" y="112" width="190" height="120" rx="14" fill="#e1f1eb" stroke="#bccbd7"/><text x="39" y="137" font-size="16" font-weight="650">Browser microphone</text><text x="39" y="161" font-size="13">Echo cancellation</text><text x="39" y="182" font-size="13">Optional CUDA isolation</text><text x="39" y="203" font-size="13">VoxLock / SciCom</text><rect x="255" y="112" width="210" height="120" rx="14" fill="#e5edf9" stroke="#bccbd7"/><text x="269" y="137" font-size="16" font-weight="650">Listen + identify</text><text x="269" y="161" font-size="13">Nemotron live preview</text><text x="269" y="182" font-size="13">TYGER / stop decisions</text><text x="269" y="203" font-size="13">VAD + speaker matching</text><rect x="505" y="112" width="215" height="120" rx="14" fill="#e5edf9" stroke="#bccbd7"/><text x="519" y="137" font-size="16" font-weight="650">End of turn</text><text x="519" y="161" font-size="13">Speech-pause timer</text><text x="519" y="182" font-size="13">Optional selected ASR</text><text x="519" y="203" font-size="13">Ears tone hints in parallel</text><rect x="760" y="112" width="215" height="120" rx="14" fill="#f6ead7" stroke="#bccbd7"/><text x="774" y="137" font-size="16" font-weight="650">Conversation model</text><text x="774" y="161" font-size="13">Qwen / local selection</text><text x="774" y="182" font-size="13">Relevant memory + tools</text><text x="774" y="203" font-size="13">Rate-limit recovery; same model</text><rect x="505" y="302" width="215" height="115" rx="14" fill="#f6ead7" stroke="#bccbd7"/><text x="519" y="327" font-size="16" font-weight="650">Voice synthesis</text><text x="519" y="351" font-size="13">Humaneness Small / Large</text><text x="519" y="372" font-size="13">Single or Best-of-3 streaming</text><text x="519" y="393" font-size="13">Verified suffix recovery</text><rect x="760" y="302" width="215" height="115" rx="14" fill="#e1f1eb" stroke="#bccbd7"/><text x="774" y="327" font-size="16" font-weight="650">Browser playback</text><text x="774" y="351" font-size="13">Playback-position clock</text><text x="774" y="372" font-size="13">Stunts start with audible speech</text><text x="774" y="393" font-size="13">Cancelable audio queue</text><rect x="25" y="302" width="440" height="115" rx="14" fill="#ede8f6" stroke="#bccbd7"/><text x="39" y="327" font-size="16" font-weight="650">Interruption side path stays live</text><text x="39" y="351" font-size="13">Microphone + playback reference → speaker-aware decision</text><text x="39" y="372" font-size="13">Stop commands cancel pending speech and screen actions.</text><text x="39" y="393" font-size="13">This path does not wait for the full LLM reply.</text><text x="28" y="465" font-size="13" fill="#435c70">Camera landmarks and gaze stay in the browser; face identity and face-based VAD are optional.</text><text x="28" y="486" font-size="13" fill="#435c70">Audio quality checks are not factual verification. A voice match is not secure authentication.</text></g></svg>