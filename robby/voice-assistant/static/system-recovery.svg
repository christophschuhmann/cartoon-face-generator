<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">04 · A failed voice attempt must not swallow the answer</title><desc id="desc">Retries are bounded. Text, speech progress and tools have separate lifecycles.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#506678" stroke-width="1.5"/></marker></defs><rect width="1000" height="520" rx="24" fill="#f5f8fb"/><g font-family="system-ui, sans-serif" fill="#1d3346"><text x="28" y="40" font-size="23" font-weight="700">04 · A failed voice attempt must not swallow the answer</text><text x="28" y="66" font-size="14" fill="#52687a">Retries are bounded. Text, speech progress and tools have separate lifecycles.</text><path d="M315 176 L355 176" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M645 176 L685 176" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M315 360 L355 360" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="25" y="112" width="290" height="130" rx="14" fill="#e5edf9" stroke="#bccbd7"/><text x="39" y="137" font-size="16" font-weight="650">A sentence is ready</text><text x="39" y="161" font-size="13">Keep its exact text and acting cue</text><text x="39" y="182" font-size="13">Start TTS; LLM keeps writing</text><text x="39" y="203" font-size="13">ASR checks actual produced words</text><text x="39" y="224" font-size="13">Stop cancels the whole operation</text><rect x="355" y="112" width="290" height="130" rx="14" fill="#f6ead7" stroke="#bccbd7"/><text x="369" y="137" font-size="16" font-weight="650">No audio published yet</text><text x="369" y="161" font-size="13">Retry transient failures / bad opening</text><text x="369" y="182" font-size="13">New seed, simpler direction</text><text x="369" y="203" font-size="13">Wait for previous worker cleanup</text><text x="369" y="224" font-size="13">Final Small attempt can use 3 lanes</text><rect x="685" y="112" width="290" height="130" rx="14" fill="#e1f1eb" stroke="#bccbd7"/><text x="699" y="137" font-size="16" font-weight="650">A prefix was published</text><text x="699" y="161" font-size="13">Exact known boundary: suffix only</text><text x="699" y="182" font-size="13">Never invent the missing words</text><text x="699" y="203" font-size="13">Never auto-replay a whole sentence</text><text x="699" y="224" font-size="13">Unknown boundary: stop recovery</text><rect x="25" y="300" width="290" height="125" rx="14" fill="#ede8f6" stroke="#bccbd7"/><text x="39" y="325" font-size="16" font-weight="650">Attempts exhausted</text><text x="39" y="349" font-size="13">Continue receiving the LLM text</text><text x="39" y="370" font-size="13">Keep the full answer on screen</text><text x="39" y="391" font-size="13">Mark speech incomplete explicitly</text><text x="39" y="412" font-size="13">Retain pending sentences in RAM</text><rect x="355" y="300" width="290" height="125" rx="14" fill="#e1f1eb" stroke="#bccbd7"/><text x="369" y="325" font-size="16" font-weight="650">Read remaining reply button</text><text x="369" y="349" font-size="13">Retry saved speech, no new LLM</text><text x="369" y="370" font-size="13">Do not repeat tools or user turns</text><text x="369" y="391" font-size="13">Warn if one sentence may repeat</text><text x="369" y="412" font-size="13">New turn replaces pending retry</text><rect x="685" y="300" width="290" height="125" rx="14" fill="#f6ead7" stroke="#bccbd7"/><text x="699" y="325" font-size="16" font-weight="650">API errors are not TTS errors</text><text x="699" y="349" font-size="13">Two 429s: alternate Qwen provider</text><text x="699" y="370" font-size="13">Only registered endpoints, same model</text><text x="699" y="391" font-size="13">Actual provider shown in timings</text><text x="699" y="412" font-size="13">Auth errors: visible, no failover</text><text x="28" y="465" font-size="13" fill="#435c70">A browser disconnect and a spoken Stop are cancellations, not reasons to replay an interrupted answer.</text><text x="28" y="486" font-size="13" fill="#435c70">Visual stunts wait through TTS retries and start with audio. Explicit silent actions still start immediately.</text></g></svg>