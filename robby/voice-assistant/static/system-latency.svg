<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">03 · What can delay the first sound?</title><desc id="desc">Illustrative flow, not a to-scale timeline. Read the live timing cards for each turn.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#506678" stroke-width="1.5"/></marker></defs><rect width="1000" height="520" rx="24" fill="#f5f8fb"/><g font-family="system-ui, sans-serif" fill="#1d3346"><text x="28" y="40" font-size="23" font-weight="700">03 · What can delay the first sound?</text><text x="28" y="66" font-size="14" fill="#52687a">Illustrative flow, not a to-scale timeline. Read the live timing cards for each turn.</text><path d="M315 176 L355 176" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M645 176 L685 176" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="25" y="112" width="290" height="130" rx="14" fill="#e5edf9" stroke="#bccbd7"/><text x="39" y="137" font-size="16" font-weight="650">Input checks</text><text x="39" y="161" font-size="13">Speech pause: user-adjustable</text><text x="39" y="182" font-size="13">Speaker identity: overlaps ASR</text><text x="39" y="203" font-size="13">Second recognizer: optional</text><text x="39" y="224" font-size="13">Off keeps native Nemotron + pause</text><rect x="355" y="112" width="290" height="130" rx="14" fill="#f6ead7" stroke="#bccbd7"/><text x="369" y="137" font-size="16" font-weight="650">Planning</text><text x="369" y="161" font-size="13">LLM time to first full sentence</text><text x="369" y="182" font-size="13">Lookup: real network round trips</text><text x="369" y="203" font-size="13">Memory: bounded context retrieval</text><text x="369" y="224" font-size="13">Quick reply: optional extra stage</text><rect x="685" y="112" width="290" height="130" rx="14" fill="#e1f1eb" stroke="#bccbd7"/><text x="699" y="137" font-size="16" font-weight="650">Output checks</text><text x="699" y="161" font-size="13">TTS computes PCM incrementally</text><text x="699" y="182" font-size="13">Parallel ASR holds first target words</text><text x="699" y="203" font-size="13">Playback queue smooths chunks</text><text x="699" y="224" font-size="13">Sound starts after those dependencies</text><rect x="25" y="300" width="290" height="125" rx="14" fill="#e1f1eb" stroke="#bccbd7"/><text x="39" y="325" font-size="16" font-weight="650">Verified · default</text><text x="39" y="349" font-size="13">TTS + ASR run concurrently</text><text x="39" y="370" font-size="13">Opening evidence, trailing cut + fade</text><text x="39" y="391" font-size="13">Measured Nov 13: ~634–689 ms</text><text x="39" y="412" font-size="13">TTS → first verified PCM (medians)</text><rect x="355" y="300" width="290" height="125" rx="14" fill="#f6ead7" stroke="#bccbd7"/><text x="369" y="325" font-size="16" font-weight="650">Raw · user choice</text><text x="369" y="349" font-size="13">Skip output ASR hold/cut</text><text x="369" y="370" font-size="13">Earlier first PCM, more artifacts</text><text x="369" y="391" font-size="13">Historical test: ~259–275 ms</text><text x="369" y="412" font-size="13">Different trade-off, not equal quality</text><rect x="685" y="300" width="290" height="125" rx="14" fill="#ede8f6" stroke="#bccbd7"/><text x="699" y="325" font-size="16" font-weight="650">Serial · comparison</text><text x="699" y="349" font-size="13">Pause TTS for verification</text><text x="699" y="370" font-size="13">Normally slower than parallel</text><text x="699" y="391" font-size="13">Historical test: ~864–877 ms</text><text x="699" y="412" font-size="13">Bridge batch checker is separate</text><text x="28" y="465" font-size="13" fill="#435c70">RTX 3090 figures are prior authored short-phrase tests, not end-to-end guarantees or measurements of this update.</text><text x="28" y="486" font-size="13" fill="#435c70">GPU contention, utterance length, provider time and browser buffering vary. Disabling checks does not remove TTS work.</text></g></svg>