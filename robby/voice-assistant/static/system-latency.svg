<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">03 · First sound: modes and trade-offs</title><desc id="desc">Warm RTX 3090 measurements, November 14. These are TTS request → first PCM, not microphone → speaker.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#506678" stroke-width="1.5"/></marker></defs><rect width="1000" height="520" rx="24" fill="#f5f8fb"/><g font-family="system-ui, sans-serif" fill="#1d3346"><text x="28" y="40" font-size="23" font-weight="700">03 · First sound: modes and trade-offs</text><text x="28" y="66" font-size="14" fill="#52687a">Warm RTX 3090 measurements, November 14. These are TTS request → first PCM, not microphone → speaker.</text><rect x="25" y="112" width="290" height="130" rx="14" fill="#e5edf9" stroke="#bccbd7"/><text x="39" y="137" font-size="16" font-weight="650">Before TTS</text><text x="39" y="161" font-size="13">Speech pause + speaker admission</text><text x="39" y="182" font-size="13">ASR final pass, if enabled</text><text x="39" y="203" font-size="13">LLM → first complete sentence</text><text x="39" y="224" font-size="13">API rate limits can add seconds</text><rect x="355" y="112" width="290" height="130" rx="14" fill="#e1f1eb" stroke="#bccbd7"/><text x="369" y="137" font-size="16" font-weight="650">Verified single · default</text><text x="369" y="161" font-size="13">TTS and word ASR overlap</text><text x="369" y="182" font-size="13">Median first PCM: 673 ms</text><text x="369" y="203" font-size="13">Median wall RTF: 0.26</text><text x="369" y="224" font-size="13">Known unspoken suffix can resume</text><rect x="685" y="112" width="290" height="130" rx="14" fill="#ede8f6" stroke="#bccbd7"/><text x="699" y="137" font-size="16" font-weight="650">Best-of-3 · optional</text><text x="699" y="161" font-size="13">3 parallel candidates / 960 ms</text><text x="699" y="182" font-size="13">ASR ranks; clone winner state</text><text x="699" y="203" font-size="13">Median first PCM: 867 ms</text><text x="699" y="224" font-size="13">Median wall RTF: 0.56</text><rect x="25" y="300" width="290" height="125" rx="14" fill="#f6ead7" stroke="#bccbd7"/><text x="39" y="325" font-size="16" font-weight="650">Raw / serial comparisons</text><text x="39" y="349" font-size="13">Raw: skip opening hold and cut</text><text x="39" y="370" font-size="13">Raw can expose unwanted speech</text><text x="39" y="391" font-size="13">Serial: pause TTS for ASR</text><text x="39" y="412" font-size="13">Neither is the default mode</text><rect x="355" y="300" width="290" height="125" rx="14" fill="#f6ead7" stroke="#bccbd7"/><text x="369" y="325" font-size="16" font-weight="650">Recovery is additional work</text><text x="369" y="349" font-size="13">Up to 3 speech attempts per unit</text><text x="369" y="370" font-size="13">Last Small retry: Best-of-3</text><text x="369" y="391" font-size="13">Never auto-replay published words</text><text x="369" y="412" font-size="13">Unknown boundary → explicit retry</text><rect x="685" y="300" width="290" height="125" rx="14" fill="#e1f1eb" stroke="#bccbd7"/><text x="699" y="325" font-size="16" font-weight="650">Browser presentation</text><text x="699" y="349" font-size="13">Playback reserve + device latency</text><text x="699" y="370" font-size="13">Motion starts at playback position</text><text x="699" y="391" font-size="13">No 4-second stunt timeout</text><text x="699" y="412" font-size="13">Complete text survives audio failure</text><text x="28" y="465" font-size="13" fill="#435c70">24 authored warm generations; TTS on GPU 0, ASR on GPU 1. The same ASR family ranked and evaluated audio.</text><text x="28" y="486" font-size="13" fill="#435c70">Cold graph setup can take minutes. These earlier speed figures are not a new guarantee after recovery changes.</text></g></svg>