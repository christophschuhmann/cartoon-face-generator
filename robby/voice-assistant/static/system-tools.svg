<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">02 · A request becomes an action</title><desc id="desc">A spoken promise is not an executed tool. All actions pass validators.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#506678" stroke-width="1.5"/></marker></defs><rect width="1000" height="520" rx="24" fill="#f5f8fb"/><g font-family="system-ui, sans-serif" fill="#1d3346"><text x="28" y="40" font-size="23" font-weight="700">02 · A request becomes an action</text><text x="28" y="66" font-size="14" fill="#52687a">A spoken promise is not an executed tool. All actions pass validators.</text><path d="M295 163 L345 163" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M160 218 L345 325" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="252.5" y="262.5" text-anchor="middle" font-size="12">paraphrase / research</text><path d="M635 163 L700 163" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M635 345 L700 345" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M635 294 L758 218" stroke="#506678" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="696.5" y="247.0" text-anchor="middle" font-size="12">avatar tool</text><rect x="25" y="113" width="270" height="105" rx="14" fill="#e1f1eb" stroke="#bccbd7"/><text x="39" y="138" font-size="16" font-weight="650">User + recent conversation</text><text x="39" y="162" font-size="13">“Mach ein ernstes Gesicht.”</text><text x="39" y="183" font-size="13">“Kannst du das mal nachgucken?”</text><rect x="345" y="113" width="290" height="105" rx="14" fill="#e5edf9" stroke="#bccbd7"/><text x="359" y="138" font-size="16" font-weight="650">Fast, unambiguous commands</text><text x="359" y="162" font-size="13">Validated direct screen action</text><text x="359" y="183" font-size="13">Unique ID → one animation</text><text x="359" y="204" font-size="13">No extra model call to recognize it</text><rect x="345" y="280" width="290" height="130" rx="14" fill="#f6ead7" stroke="#bccbd7"/><text x="359" y="305" font-size="16" font-weight="650">Model-driven interpretation</text><text x="359" y="329" font-size="13">Streaming model can request tools</text><text x="359" y="350" font-size="13">Tool director resolves context</text><text x="359" y="371" font-size="13">Real schemas, bounded arguments</text><text x="359" y="392" font-size="13">Result → spoken acknowledgment</text><rect x="700" y="113" width="275" height="105" rx="14" fill="#e1f1eb" stroke="#bccbd7"/><text x="714" y="138" font-size="16" font-weight="650">Avatar executor</text><text x="714" y="162" font-size="13">40 emotions + 8 grimaces</text><text x="714" y="183" font-size="13">Body spin, somersault, nod…</text><text x="714" y="204" font-size="13">Reduced motion / off respected</text><rect x="700" y="280" width="275" height="130" rx="14" fill="#ede8f6" stroke="#bccbd7"/><text x="714" y="305" font-size="16" font-weight="650">Information + session tools</text><text x="714" y="329" font-size="13">News · weather · Wikipedia</text><text x="714" y="350" font-size="13">Web search: retrieved extracts</text><text x="714" y="371" font-size="13">Explicit interruption rules</text><text x="714" y="392" font-size="13">Sources and timings in metadata</text><text x="28" y="465" font-size="13" fill="#435c70">Quoted or negated commands do not trigger the fast action path; old topics do not force every turn through tools.</text><text x="28" y="486" font-size="13" fill="#435c70">Web search uses OpenRouter / Exa with API charges. It is read-only retrieval, not an unrestricted browser.</text></g></svg>