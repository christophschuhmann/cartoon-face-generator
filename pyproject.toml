[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartoon-face-rig"
version = "1.0.0"
description = "A semantic, reproducible SVG face rig and reference fitting tools"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.11", "opencv-python-headless>=4.8", "Pillow>=10", "CairoSVG>=2.7", "scikit-image>=0.22", "Flask>=3"]

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.48"]

[project.scripts]
face = "cartoon_face.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cartoon_face = ["topology/*.json", "emotions/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
